name: Fast Checks
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  fast_checks:
    name: Fast Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install lintofu
        run: npm ci
      - name: lintofu
        run: npm run lint
